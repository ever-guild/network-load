<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <title>TVM-Based networks — current load</title>
    <style>
        @font-face {
            font-family: 'JetBrains Mono';
            src: url('https://cdn.jsdelivr.net/gh/JetBrains/JetBrainsMono/web/woff2/JetBrainsMono-Regular.woff2') format('woff2'),
            url('https://cdn.jsdelivr.net/gh/JetBrains/JetBrainsMono/web/woff/JetBrainsMono-Regular.woff') format('woff');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        body {
            font-family: 'JetBrains Mono', monospace;
            margin: 0;
            padding: 0;
        }

        h3 {
            margin-bottom: 0;
        }

        h4 {
            margin-top: 0;
            margin-bottom: 0;
        }
    </style>
    <script>
      const u8 = (value) => BigInt.asUintN(8, BigInt(value)).toString(16)

      function metricUpdate(elem) {
        let startTime
        let totalTransactionCount = 0
        let totalBlockCount = 0
        const wcCount = {}

        return (block) => {
          const transactionCount = block.tr_count
          const workchainId = u8(block.workchain_id)
          wcCount[workchainId] = (wcCount[workchainId] || 0) + transactionCount
          const nowTime = Date.now()
          if (!startTime) {
            startTime = Date.now()
          }
          totalTransactionCount += transactionCount
          totalBlockCount += 1
          const timeDiff = nowTime - startTime
          const BPS = Number(totalBlockCount / timeDiff * 1000)
          const TPS = Number(totalTransactionCount / timeDiff * 1000)
          const TPSMC = Number(wcCount['ff'] / timeDiff * 1000)
          const TPSMWC0 = Number(wcCount['0'] / timeDiff * 1000)
          if (timeDiff > 10000) {
            elem.updateElem('bps', `${BPS.toFixed(1)}`)
            elem.updateElem('tps', `${TPS.toFixed(1)}`)
            if (TPSMC) {
              elem.updateElem('tpsMC', `${TPSMC.toFixed(2)}`)
              elem.updateElem('tpsWC0', `${TPSMWC0 >= 0 ? TPSMWC0.toFixed(2) : '...'}`)
            }
          }
        }
      }

      function createMetric(root, network) {
        const out = document.createElement('div')
        out.className = 'metric'
        let extra = ''
        if (!network.includes('ackinacki')) {
            extra += '<span>(MC: <span data-behavior="tpsMC">...</span></span>'
            extra += '<span> WC: <span data-behavior="tpsWC0">...</span>)</span>'
        }
        out.innerHTML = `<h3>${name(network)}</h3>
<h4>
 <span> BPS: <span data-behavior='bps'>...</span><span>
 <span> TPS: <span data-behavior='tps'>...</span><span>
 ${extra}
</h4>
<div data-behavior='output'></div>`
        out.updateElem = (name, value) => {
          const target = out.querySelector(`[data-behavior=${name}]`)
          if (target) target.innerHTML = value
        }
        root.append(out)
        return {
          elem: out,
          up: metricUpdate(out),
          log: (message) => out.updateElem('output', message),
        }
      }

      function startLongPolling({ intervalMs = 1500, fetchOnce, normalize, onBatch, onError, onLog }) {
        let stopped = false
        let delayMs = intervalMs
        async function tick() {
          if (stopped) return
          try {
            const raw = await fetchOnce()
            const normalized = normalize(raw)
            await onBatch(normalized, raw)
            delayMs = intervalMs
          } catch (e) {
            const requestedDelay = onError && await onError(e)
            if (Number.isFinite(requestedDelay) && requestedDelay >= 0) delayMs = requestedDelay
            else delayMs = intervalMs
          } finally {
            if (!stopped) setTimeout(tick, delayMs)
          }
        }
        if (onLog) onLog('Starting long-poll...')
        tick()
        return { stop: () => { stopped = true } }
      }

      function createPollingMetricsAggregator(elem, options = {}) {
        const retentionMs = options.retentionMs || 5 * 60 * 1000 // keep ids for 5 minutes
        const seenBlocks = new Map()
        const metricBlocks = new Map()
        const blockCoordinates = new Map()
        let latestObservedBlockTime = 0
        let latestBlockObservedAt
        const monotonicNow = () => globalThis.performance?.now?.() ?? Date.now()

        function prune(now, latestBlockTime) {
          for (const [id, lastSeenAt] of seenBlocks) {
            if (now - lastSeenAt > retentionMs) seenBlocks.delete(id)
          }
          for (const [id, block] of metricBlocks) {
            if (latestBlockTime - block.gen_utime > retentionMs / 1000) {
              metricBlocks.delete(id)
              if (blockCoordinates.get(block.coordinate || id) === id) blockCoordinates.delete(block.coordinate || id)
            }
          }
        }

        function ingest({ blocks = [], transactions = [], serverTime, serverObservedAt }) {
          const now = Date.now()
          let newBlocks = 0
          const batchLatestBlockTime = blocks.reduce((latest, block) =>
            typeof block?.gen_utime === 'number' ? Math.max(latest, block.gen_utime) : latest, 0)

          // Each successful TON poll is a window snapshot. If its tip moves
          // backwards, discard the previous branch before ingesting the snapshot.
          if (batchLatestBlockTime > 0 && batchLatestBlockTime < latestObservedBlockTime) {
            seenBlocks.clear()
            metricBlocks.clear()
            blockCoordinates.clear()
            latestObservedBlockTime = 0
            latestBlockObservedAt = undefined
          }

          for (const b of blocks) {
            if (!b || !b.id || typeof b.gen_utime !== 'number') continue
            const coordinate = b.coordinate || b.id
            const previousId = blockCoordinates.get(coordinate)
            if (previousId && previousId !== b.id) {
              seenBlocks.delete(previousId)
              metricBlocks.delete(previousId)
            }
            blockCoordinates.set(coordinate, b.id)
            const seen = seenBlocks.get(b.id)
            if (seen) {
              seenBlocks.set(b.id, now)
            } else {
              seenBlocks.set(b.id, now)
              newBlocks += 1
              metricBlocks.set(b.id, b)
            }
          }

          if (batchLatestBlockTime > latestObservedBlockTime) {
            latestObservedBlockTime = batchLatestBlockTime
            const elapsedSinceServerSnapshotMs = Number.isFinite(serverObservedAt)
              ? Math.max(0, monotonicNow() - serverObservedAt)
              : 0
            const tipAgeMs = Number.isFinite(serverTime)
              ? Math.max(0, serverTime - batchLatestBlockTime * 1000) + elapsedSinceServerSnapshotMs
              : 0
            latestBlockObservedAt = monotonicNow() - tipAgeMs
          }
          const elapsedSinceTipMs = latestBlockObservedAt === undefined
            ? 0
            : Math.max(0, monotonicNow() - latestBlockObservedAt)
          prune(now, latestObservedBlockTime + elapsedSinceTipMs / 1000)

          // Calculate metrics based on block time range, not client time
          const metricValues = [...metricBlocks.values()]
          if (metricValues.length > 0) {
            let firstBlockTime = metricValues[0].gen_utime
            let lastBlockTime = metricValues[0].gen_utime
            let totalTransactionCount = 0
            const wcTransactionCount = {}
            for (const block of metricValues) {
              firstBlockTime = Math.min(firstBlockTime, block.gen_utime)
              lastBlockTime = Math.max(lastBlockTime, block.gen_utime)
              totalTransactionCount += block.tr_count || 0
              if (block.workchain_id !== undefined) {
                const wc = u8(block.workchain_id)
                wcTransactionCount[wc] = (wcTransactionCount[wc] || 0) + (block.tr_count || 0)
              }
            }
            const totalBlockCount = metricValues.length
            const timeDiffSeconds = lastBlockTime - firstBlockTime
            if (timeDiffSeconds > 1) {
              const BPS = Number(totalBlockCount / timeDiffSeconds)
              const TPS = Number(totalTransactionCount / timeDiffSeconds)
              const TPSMC = Number((wcTransactionCount['ff'] || 0) / timeDiffSeconds)
              const TPSWC0 = Number((wcTransactionCount['0'] || 0) / timeDiffSeconds)

              elem.updateElem('bps', `${BPS.toFixed(1)}`)
              elem.updateElem('tps', `${TPS.toFixed(1)}`)
              elem.updateElem('tpsMC', `${TPSMC.toFixed(2)}`)
              elem.updateElem('tpsWC0', `${TPSWC0.toFixed(2)}`)
            } else {
              elem.updateElem('bps', '0.0')
              elem.updateElem('tps', '0.0')
              elem.updateElem('tpsMC', '0.00')
              elem.updateElem('tpsWC0', '0.00')
            }
          } else {
            elem.updateElem('bps', '0.0')
            elem.updateElem('tps', '0.0')
            elem.updateElem('tpsMC', '0.00')
            elem.updateElem('tpsWC0', '0.00')
          }

          return { newBlocks, newTxs: 0 }
        }

        function nextMetricExpiryDelayMs() {
          return latestBlockObservedAt === undefined
            ? undefined
            : Math.max(0, retentionMs - (monotonicNow() - latestBlockObservedAt))
        }

        return { ingest, nextMetricExpiryDelayMs }
      }

      function notImplemented(root, network) {
        const { log } = createMetric(root, network)
        log(`<span style='color: red'>ERROR:</span> not impliment ${network}`)
      }

      function latestBlock(blocks, field) {
        return blocks.reduce((latest, block) => !latest || block[field] > latest[field] ? block : latest, null)
      }

      function blockPolling(root, network, provider) {
        const { elem, log } = createMetric(root, network)
        const aggregator = createPollingMetricsAggregator(elem)
        let metricAgingTimer
        const scheduleMetricAging = (delay) => {
          const expiryDelay = aggregator.nextMetricExpiryDelayMs()
          if (!Number.isFinite(delay) || delay <= expiryDelay || expiryDelay <= 0) return
          if (metricAgingTimer) clearTimeout(metricAgingTimer)
          metricAgingTimer = setTimeout(() => aggregator.ingest({}), expiryDelay)
        }
        if (provider.onWait) provider.onWait(scheduleMetricAging)
        startLongPolling({
          intervalMs: provider.intervalMs,
          fetchOnce: provider.fetchOnce,
          normalize: provider.normalize,
          onBatch: normalized => {
            if (metricAgingTimer) clearTimeout(metricAgingTimer)
            aggregator.ingest(normalized)
            const latest = provider.onBatch ? provider.onBatch(normalized) : latestBlock(normalized.blocks, provider.latestBy)
            if (latest) log(logTemplate(network, latest))
          },
          onError: async error => {
            if (metricAgingTimer) clearTimeout(metricAgingTimer)
            aggregator.ingest({})
            if (provider.onError) {
              const delay = await provider.onError(error, log)
              const appliedDelay = Math.max(
                Number.isFinite(delay) ? delay : 0,
                Number.isFinite(error.retryAfterMs) ? error.retryAfterMs : 0,
              )
              scheduleMetricAging(appliedDelay)
              return delay
            }
            log(`<span style='color: red'>ERROR:</span> ${escapeHtml(error.message || error)}`)
          },
          onLog: log,
        })
      }

      function graphqlBlockProvider(network) {
        const query = `query { blockchain { blocks( last: 500 ) { edges { node { hash seq_no workchain_id shard gen_utime tr_count gen_software_version } } } } }`
        const url = `https://${graphqlHost(network)}/graphql?_=_&isBlockChainApiQuery=true&query=${encodeURIComponent(query)}`
        return {
          intervalMs: 1500,
          fetchOnce: async () => {
            const response = await fetch(url, { method: 'GET', cache: 'no-store' })
            if (!response.ok) throw new Error(`HTTP ${response.status}`)
            return response.json()
          },
          normalize: response => ({
            blocks: (response?.data?.blockchain?.blocks?.edges || []).map(edge => edge.node).filter(Boolean).map(node => ({
              id: node.hash,
              tr_count: node.tr_count,
              workchain_id: node.workchain_id,
              seq_no: node.seq_no,
              shard: node.shard,
              gen_utime: node.gen_utime,
              gen_software_version: node.gen_software_version,
            })),
            transactions: [],
          }),
          latestBy: 'seq_no',
        }
      }

      function tonApiHost(network) {
        switch (network) {
          case 'ton-test':
            return 'https://testnet.toncenter.com/api/v3'
          case 'ton-main':
            return 'https://toncenter.com/api/v3'
          default:
            throw new Error(`Unsupported TON network: ${network}`)
        }
      }

      function parseTonInteger(value) {
        if (typeof value === 'number') return Number.isSafeInteger(value) ? value : undefined
        if (typeof value !== 'string' || !/^-?(?:0|[1-9]\d*)$/.test(value)) return undefined
        const parsed = Number(value)
        return Number.isSafeInteger(parsed) ? parsed : undefined
      }

      function parseTonHash(value) {
        if (typeof value !== 'string') return undefined
        if (/^[\da-f]{64}$/i.test(value) || /^[A-Za-z0-9+/]{43}=$/.test(value)) return value
        return undefined
      }

      function normalizeTonBlocks(response) {
        const list = response?.blocks
        if (!Array.isArray(list)) throw new Error('Invalid TON Center block response')

        const blocks = list.map(block => {
          const workchainId = parseTonInteger(block?.workchain)
          const transactionCount = parseTonInteger(block?.tx_count)
          const seqNo = parseTonInteger(block?.seqno)
          const generationTime = parseTonInteger(block?.gen_utime)
          const shard = String(block?.shard || '')
          const rootHash = parseTonHash(block?.root_hash)
          const fileHash = parseTonHash(block?.file_hash)
          if (!/^[\da-f]{16}$/i.test(shard)) throw new Error('Invalid TON block shard')
          if (!rootHash || !fileHash) {
            throw new Error('Invalid TON block hash')
          }
          if (!Number.isSafeInteger(workchainId) || workchainId < -2147483648 || workchainId > 2147483647 ||
            !Number.isSafeInteger(transactionCount) || transactionCount < 0 ||
            !Number.isSafeInteger(seqNo) || seqNo < 0 ||
            !Number.isSafeInteger(generationTime) || generationTime < 0 || generationTime > 0xffffffff) {
            throw new Error('Invalid TON block')
          }
          const normalized = {
            id: `${workchainId}:${shard}:${seqNo}:${rootHash}:${fileHash}`,
            coordinate: `${workchainId}:${shard}:${seqNo}`,
            tr_count: transactionCount,
            workchain_id: workchainId,
            seq_no: seqNo,
            shard,
            gen_utime: generationTime,
          }
          if (!Object.values(normalized).every(value => value !== '' && value !== undefined)) {
            throw new Error('Invalid TON block')
          }
          return normalized
        })
        return {
          blocks,
          transactions: [],
          serverTime: response?.serverTime,
          serverObservedAt: response?.serverObservedAt,
        }
      }

      function normalizeTychoBlocks(response) {
        const list = response?.blocks
        if (!Array.isArray(list)) throw new Error('Invalid Tycho block response')

        return {
          blocks: list.map(block => {
            const workchainId = parseTonInteger(block?.workchain)
            const transactionCount = parseTonInteger(block?.transactionCount)
            const seqNo = parseTonInteger(block?.seqno)
            const generationTime = parseTonInteger(block?.genUtime)
            const shard = String(block?.shard || '')
            const rootHash = typeof block?.rootHash === 'string' && /^[\da-f]{64}$/i.test(block.rootHash)
              ? block.rootHash
              : undefined
            if (!/^[\da-f]{16}$/i.test(shard) || !rootHash ||
              !Number.isSafeInteger(workchainId) || workchainId < -2147483648 || workchainId > 2147483647 ||
              !Number.isSafeInteger(transactionCount) || transactionCount < 0 ||
              !Number.isSafeInteger(seqNo) || seqNo < 0 ||
              !Number.isSafeInteger(generationTime) || generationTime < 0 || generationTime > 0xffffffff) {
              throw new Error('Invalid Tycho block')
            }
            const normalized = {
              id: rootHash,
              coordinate: `${workchainId}:${shard}:${seqNo}`,
              tr_count: transactionCount,
              workchain_id: workchainId,
              seq_no: seqNo,
              shard,
              gen_utime: generationTime,
            }
            const softwareVersion = parseTonInteger(block?.genSoftwareVersion)
            if (Number.isSafeInteger(softwareVersion) && softwareVersion >= 0) {
              normalized.gen_software_version = softwareVersion
            }
            return normalized
          }),
          transactions: [],
        }
      }

      function retryAfterMs(value, now = Date.now(), serverDate) {
        if (!value) return undefined
        if (/^\d+$/.test(value.trim())) {
          const delay = Number(value) * 1000
          return Number.isFinite(delay) ? Math.max(delay, 1000) : undefined
        }
        const retryAt = Date.parse(value)
        const serverNow = Date.parse(serverDate)
        const delay = retryAt - (Number.isFinite(serverNow) ? serverNow : now)
        return Number.isFinite(delay) ? Math.max(delay, 1000) : undefined
      }

      const tonGuestIntervalMs = 10000
      const tonRequestTimeoutMs = 30000
      const tonMaxBackoffMs = 300000

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char])
      }

      function createTonRequestScheduler({
        minIntervalMs = tonGuestIntervalMs,
        now = () => Date.now(),
        sleep = (delay) => new Promise(resolve => setTimeout(resolve, delay)),
        onWait = () => {},
      } = {}) {
        let tail = Promise.resolve()
        let lastRequestAt
        return async (request) => {
          const run = async () => {
            while (true) {
              const nextRequestAt = Math.max(
                lastRequestAt === undefined ? 0 : lastRequestAt + minIntervalMs,
              )
              const delay = Math.max(0, nextRequestAt - now())
              if (delay === 0) break
              onWait(delay)
              await sleep(delay)
            }
            lastRequestAt = now()
            return request()
          }
          const dispatched = tail.then(run, run)
          tail = dispatched.catch(() => {})
          return dispatched
        }
      }

      const tonGuestNextRequestKey = 'network-load-ton-guest-next-request-at'
      const tonGuestBackoffs = new WeakMap()
      const tonWaitListeners = new Set()
      const maxTimerDelayMs = 2 ** 31 - 1

      async function wait(delay) {
        const deadline = Date.now() + delay
        while (true) {
          const remaining = deadline - Date.now()
          if (remaining <= 0) return
          await new Promise(resolve => setTimeout(resolve, Math.min(remaining, maxTimerDelayMs)))
        }
      }

      function notifyTonWait(delay) {
        for (const listener of tonWaitListeners) listener(delay)
      }

      // The scheduler shares one guest rate limit between networks in this page.
      const scheduleTonRequestLocally = createTonRequestScheduler({ onWait: notifyTonWait })

      async function reserveTonGuestSlot(locks) {
        try {
          while (true) {
            const delay = await locks.request('network-load-ton-guest-slot', () => {
              const now = Date.now()
              const nextRequestAt = Number(globalThis.localStorage.getItem(tonGuestNextRequestKey)) || 0
              if (nextRequestAt > now) return nextRequestAt - now
              globalThis.localStorage.setItem(tonGuestNextRequestKey, String(now + tonGuestIntervalMs))
              return 0
            })
            if (delay <= 0) return true
            notifyTonWait(delay)
            await wait(delay)
          }
        } catch {
          return false
        }
      }

      async function deferTonGuestRequests(locks, delay) {
        try {
          await locks.request('network-load-ton-guest-slot', () => {
            const nextRequestAt = Number(globalThis.localStorage.getItem(tonGuestNextRequestKey)) || 0
            globalThis.localStorage.setItem(tonGuestNextRequestKey, String(Math.max(nextRequestAt, Date.now() + delay)))
          })
        } catch {
          // Page-local scheduling remains active when persistent storage is unavailable.
        }
      }

      async function runTonGuestRequest(request, fallback) {
        const response = await request()
        if (response.status === 429) {
          const retryAfter = retryAfterMs(response.headers.get('Retry-After'), Date.now(), response.headers.get('Date'))
          const backoff = Math.max(tonGuestIntervalMs, retryAfter || fallback.retryMs)
          tonGuestBackoffs.set(response, backoff)
          notifyTonWait(backoff)
          if (!retryAfter) fallback.retryMs = Math.min(fallback.retryMs * 2, tonMaxBackoffMs)
        }
        return response
      }

      function scheduleTonRequest(request, fallback) {
        const locks = globalThis.navigator?.locks
        const runLocally = async () => {
          const response = await runTonGuestRequest(request, fallback)
          const backoff = tonGuestBackoffs.get(response)
          if (backoff) await wait(backoff)
          return response
        }
        if (!locks) return scheduleTonRequestLocally(runLocally)
        return (async () => {
          if (!await reserveTonGuestSlot(locks)) return scheduleTonRequestLocally(runLocally)
          const response = await runTonGuestRequest(request, fallback)
          const backoff = tonGuestBackoffs.get(response)
          if (backoff) await deferTonGuestRequests(locks, backoff)
          return response
        })()
      }

      function tonBlockProvider(network) {
        const baseUrl = `${tonApiHost(network)}/blocks`
        const historySeconds = 300
        const guestFallback = { retryMs: 30000 }
        let latestGenerationTime
        const fetchPage = async (params) => {
          let controller
          let timeout
          try {
            const response = await scheduleTonRequest(() => {
              controller = new AbortController()
              timeout = setTimeout(() => controller.abort(), tonRequestTimeoutMs)
              return fetch(`${baseUrl}?${params}`, {
                method: 'GET',
                headers: { Accept: 'application/json' },
                cache: 'no-store',
                signal: controller.signal,
              }).then(response => {
                clearTimeout(timeout)
                timeout = undefined
                return response
              })
            }, guestFallback)
            if (!response.ok) {
              const error = new Error(`HTTP ${response.status}`)
              if (response.status === 429) {
                error.retryAfterMs = tonGuestBackoffs.get(response)
                error.guestBackoffApplied = tonGuestBackoffs.has(response)
              }
              throw error
            }
            guestFallback.retryMs = 30000
            timeout = setTimeout(() => controller.abort(), tonRequestTimeoutMs)
            const body = await response.json()
            const serverTime = Date.parse(response.headers.get('Date'))
            const serverObservedAt = globalThis.performance?.now?.()
            return Number.isFinite(serverTime) ? { ...body, serverTime, serverObservedAt } : body
          } catch (error) {
            if (controller?.signal.aborted) throw new Error('TON request timed out')
            throw error
          } finally {
            if (timeout) clearTimeout(timeout)
          }
        }
        const fetchOnce = async () => {
          if (latestGenerationTime === undefined) {
            return fetchPage('limit=1000&sort=desc')
          }

          const snapshot = await fetchPage('limit=1&sort=desc')
          const snapshotBlocks = snapshot?.blocks
          if (!Array.isArray(snapshotBlocks)) throw new Error('Invalid TON Center block response')
          if (snapshotBlocks.length === 0) return { blocks: [] }
          const endUtime = Number(snapshotBlocks[0].gen_utime)
          // Re-read the retained metric window: TON Center can index an older block
          // after a newer generation time has already been observed.
          let startUtime = Math.max(0, endUtime - historySeconds)
          if (!Number.isSafeInteger(endUtime) || endUtime < startUtime) {
            throw new Error('Invalid TON block snapshot')
          }

          const fetchRange = async (start, end) => {
            const page = await fetchPage(`start_utime=${start}&end_utime=${end}&limit=1000&sort=desc`)
            if (!Array.isArray(page?.blocks)) throw new Error('Invalid TON Center block response')
            if (page.blocks.length < 1000) return page.blocks
            if (end <= start) throw new Error('TON block range exceeds guest request limit')
            const middle = Math.floor((start + end) / 2)
            return [...await fetchRange(start, middle), ...await fetchRange(middle + 1, end)]
          }
          return {
            blocks: await fetchRange(startUtime, endUtime),
            serverTime: snapshot.serverTime,
            serverObservedAt: snapshot.serverObservedAt,
          }
        }
        return {
          intervalMs: tonGuestIntervalMs,
          onWait: listener => tonWaitListeners.add(listener),
          fetchOnce,
          normalize: normalizeTonBlocks,
          onBatch: normalized => {
            guestFallback.retryMs = 30000
            const latest = latestBlock(normalized.blocks, 'gen_utime')
            if (latest) latestGenerationTime = Math.max(latestGenerationTime || 0, latest.gen_utime)
            return latest
          },
          onError: async (error, log) => {
            if (!error.message?.startsWith('HTTP 429')) {
              log(`<span style='color: red'>ERROR:</span> ${escapeHtml(error.message || error)}`)
              return
            }
            const delay = error.retryAfterMs || tonGuestIntervalMs
            log(`Rate limited; retrying in ${Math.ceil(delay / 1000)}s`)
            return error.guestBackoffApplied ? 0 : delay
          },
        }
      }

      function blockPollingTonCore(root, network) {
        blockPolling(root, network, tonBlockProvider(network))
      }

      function tychoBlockProvider() {
        const url = 'https://api-testnet.tychoprotocol.com/v1/blocks/list'
        return {
          intervalMs: 1500,
          fetchOnce: async () => {
            const response = await fetch(url, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ limit: 1000 }),
              cache: 'no-store',
            })
            if (!response.ok) throw new Error(`HTTP ${response.status}`)
            return response.json()
          },
          normalize: normalizeTychoBlocks,
          latestBy: 'gen_utime',
        }
      }

      function blockSubscriptionEverX(root, network) {
        const query = 'subscription {blocks {id tr_count workchain_id seq_no shard gen_software_version}}'
        const {up, log} = createMetric(root, network)
        const connect = (url) => {
          const start = Date.now()
          let dataCount = 0
          let dataEmptyCount = 0
          const websocket = new WebSocket(url, [
            'graphql-ws',
          ])
          websocket.onopen = function() {
            log('Trying to connect...')
            websocket.send('{"type":"connection_init","payload":{}}')
            websocket.send(`{"id":"1","type":"start","payload":{"variables":{},"extensions":{},"operationName":null,"query":"${query}"}}`)
          }
          websocket.onclose = function() {
            log('Disconnected, reconnect will be attempted in 5 second...')
            setTimeout(function() {
              connect(url)
            }, 5000)
          }
          websocket.onmessage = function(event) {
            const count = 1 / dataEmptyCount * dataCount
            const data = JSON.parse(event.data)
            if (data.type === 'data') {
              dataCount += 1
              const block = data.payload.data.blocks
              log(logTemplate(network, block))
              up(block)
            } else {
              dataEmptyCount += 1
            }

            if (count < 1 && Date.now() - start > 10000) {
              websocket.close()
            }
          }
          websocket.onerror = function(event) {
            log(`<span style='color: red'>ERROR:</span> ${event.data}`)
            websocket.close()
          }
        }
        connect(`wss://${graphqlHost(network)}/graphql`)
      }

      function logTemplate(network, block) {
        const url = explorerBlock(network, block)
        let content = `${block.workchain_id}:${block.shard.slice(0, 2)}:${block.seq_no}`
        if (block.gen_software_version) {
          content += `|v${block.gen_software_version}`
        }
        if (network.includes('ackinacki')) {
          content = `${block.seq_no}`
        }
        if (url) {
          return `<span><a target="_blank" href="${url}">${content}</a></span>`
        }
        return `<span>${content}</span>`
      }

      function explorerBlock(network, block) {
        switch (network) {
          case 'ackinacki-mainnet':
            return `https://acki.live/blocks/${block.id}`
          case 'ackinacki-shellnet':
            return `https://shellnet.acki.live/blocks/${block.id}`
          case 'ever-main':
            return 'https://evertx.us/validators' // TODO Replace with a code block page, @agapak will develop it
          case 'ever-test':
            return `https://testnet.everscan.io/blocks/${block.workchain_id}/${block.shard}/${block.seq_no}`
          case 'venom-main':
            return `https://venomscan.com/blocks/${block.workchain_id}/${block.shard}/${block.seq_no}`
          case 'venom-test':
            return `https://testnet.venomscan.com/blocks/${block.workchain_id}/${block.shard}/${block.seq_no}`
          case 'gosh-main':
            return `https://gosh.live/blocks/blockDetails?id=${block.id}`
          case 'gosh-test':
            return `https://ackinacki-testnet.tvmlabs.dev/blocks/blockDetails?id=${block.id}`
          case 'ever-beta':
            return `https://rfld.ever.live/blocks/blockDetails?id=${block.id}`
          case 'ever-smft':
            return `https://smft.ever.live/blocks/blockDetails?id=${block.id}`
          case 'ton-main':
            return `https://tonscan.org/block/${block.workchain_id}:${block.shard}:${block.seq_no}`
          case 'ton-test':
            return `https://testnet.tonscan.org/block/${block.workchain_id}:${block.shard}:${block.seq_no}`
          case 'tycho-test':
            return `https://testnet.tychoprotocol.com/blocks/${block.id}`
          default:
            return null
        }
      }

      function graphqlHost(network) {
        const projectID = 'a3446bfb5e4e4f2a84d68400a28d990e'
        switch (network) {
          case 'ackinacki-shellnet':
            return 'shellnet.ackinacki.org'
          case 'ackinacki-mainnet':
            return 'mainnet.ackinacki.org'
          case 'gosh-main':
            return 'gra01.network.gosh.sh'
          case 'venom-main':
            return 'venom-mainnet.tvmlabs.dev'
          case 'venom-test':
            return 'venom-testnet.tvmlabs.dev'
          case 'ever-main':
            return `mainnet.evercloud.dev/${projectID}`
          case 'ever-test':
            return `devnet.evercloud.dev/${projectID}`
          case 'ton-main':
            return 'ton-mainnet.tvmlabs.dev'
          case 'ton-test':
            return 'ton-testnet.tvmlabs.dev'
          default:
            return `${network}.evercloud.dev/${projectID}`
        }
      }

      function name(network) {
        switch (network) {
          case 'ackinacki-shellnet':
            return 'Acki Nacki Testnet'
          case 'ackinacki-mainnet':
            return 'Acki Nacki Mainnet'
          case 'gosh-main':
            return 'Gosh Mainnet'
          case 'venom-main':
            return 'Venom Mainnet'
          case 'venom-test':
            return 'Venom Testnet'
          case 'ever-main':
            return 'Everscale Mainnet'
          case 'ever-test':
            return 'Everscale Testnet'
          case 'ton-main':
            return 'TON Mainnet'
          case 'ton-test':
            return 'TON Testnet'
          case 'tycho-test':
            return 'Tycho Testnet'
          default:
            return network
        }
      }

      function loadWidget(elem, network) {
        switch (network) {
          case 'ackinacki-shellnet':
          case 'ackinacki-mainnet':
            blockPolling(elem, network, graphqlBlockProvider(network))
            break
          case 'ton-main':
          case 'ton-test':
            blockPollingTonCore(elem, network)
            break
          case 'tycho-test':
            blockPolling(elem, network, tychoBlockProvider())
            break
          case 'ever-main':
          case 'ever-test':
          case 'venom-main':
          case 'venom-test':
            blockSubscriptionEverX(elem, network)
            break
          default:
            notImplemented(elem, network)
        }
      }

      window.addEventListener('load', function () {
        const root = document.querySelector('[data-behavior=content]')
        loadWidget(root, 'ton-main')
        // loadWidget(root, 'ton-test')
        loadWidget(root, 'ever-main')
        // loadWidget(root, 'ever-test')
        // loadWidget(root, 'venom-main')
        // loadWidget(root, 'venom-test')
        loadWidget(root, 'ackinacki-mainnet')
        // loadWidget(root, 'ackinacki-shellnet')
        loadWidget(root, 'tycho-test')
      })
    </script>
</head>
